# Release configuration for Hyperion Trace. Runs from .github/workflows/release.yml
# when a v* tag is pushed. Try it locally without publishing:
#   goreleaser release --snapshot --clean --skip=sign,publish
version: 2

project_name: hyperion-trace

before:
  hooks:
    - go mod verify
    # Man page generated from the CLI definition (fang's hidden `man` command).
    - mkdir -p dist-extra
    - sh -c 'go run ./cmd/hyperion-trace man | gzip -9n > dist-extra/hyperion-trace.1.gz'

builds:
  - id: hyperion-trace
    main: ./cmd/hyperion-trace
    binary: hyperion-trace
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    # Reproducible builds: file times come from the commit, not the build.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - src: dist-extra/hyperion-trace.1.gz
        dst: man
        strip_parent: true

nfpms:
  - id: packages
    package_name: hyperion-trace
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Talfaza
    homepage: https://github.com/Talfaza/hyperion
    maintainer: Talfaza <charifyahia4@gmail.com>
    description: |-
      Read-only Linux security posture scanner for ISO/IEC 27001:2022.
      Audits a host against the Hyperion hardening baseline (55 checks)
      and prints a 0-100 score with a fix for every finding.
    license: Apache-2.0
    section: admin
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      # Where the exceptions file lives: root-owned and not writable by
      # others, as the scanner requires.
      - dst: /etc/hyperion
        type: dir
        file_info:
          mode: 0755
          owner: root
          group: root
      - src: dist-extra/hyperion-trace.1.gz
        dst: /usr/share/man/man1/hyperion-trace.1.gz
        file_info:
          mode: 0644
      # Debian expects the license in doc/<package>/copyright (machine-readable
      # format); it is kept even on slim systems that drop other doc files.
      - src: packaging/deb/copyright
        dst: /usr/share/doc/hyperion-trace/copyright
        packager: deb
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/hyperion-trace/LICENSE
        packager: rpm
        file_info:
          mode: 0644
      - src: NOTICE
        dst: /usr/share/doc/hyperion-trace/NOTICE
        file_info:
          mode: 0644

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless signing: GitHub Actions' OIDC identity is the signer, so there is no
# private key to store or leak. Signing checksums.txt covers every file.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

changelog:
  use: git
  sort: asc
  groups:
    - title: New
      regexp: '^new:'
      order: 0
    - title: Improvements
      regexp: '^add:'
      order: 1
    - title: Removed
      regexp: '^delete:'
      order: 2
    - title: Other
      order: 999

release:
  # Created as a draft: review the notes and files on GitHub, then publish.
  draft: true
  prerelease: auto
  footer: |
    ### Verify this release

    ```sh
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp '^https://github.com/Talfaza/hyperion/\.github/workflows/release\.yml@refs/tags/v' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum --ignore-missing -c checksums.txt
    ```
